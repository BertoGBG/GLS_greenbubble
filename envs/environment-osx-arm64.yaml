name: greenbubble-pypsa14
channels:
  - gurobi
  - conda-forge
dependencies:
  - python=3.11
  - numpy>=1.26
  - pandas>=3.0
  - pyarrow
  - xarray>=2025.1
  - scipy
  - networkx
  - pypsa=1.4.0
  - reverse_geocoder
  - timezonefinder

  - linopy>=0.10.1,<0.11
  - highspy>=1.11,!=1.14.0
  - glpk
  - gurobi

  # NetCDF/HDF stack
  - netcdf4>=1.6
  - cftime>=1.6
  - h5py>=3.15
  - hdf5
  - libnetcdf

  # GIS stack (atlite dependencies)
  - atlite>=0.4
  - geopandas>=0.14
  - rasterio>=1.3
  - shapely>=2
  - pyproj>=3.6
  - cartopy>=0.22
  - proj-data
  - rtree

  # performance / misc
  - numexpr
  - bottleneck
  - dask>=2025.10
  - matplotlib>=3.10
  - seaborn>=0.13
  - graphviz

  # notebooks + utilities
  - ipython
  - jupyterlab
  - ipykernel
  - openpyxl
  - requests
  - tqdm
  - coolprop

  - pip
  - pip:
      - entsoe-py
      - geojson-rewind  # needed by entsoe.geo (bidding zone lookup)
      - pypsatopo
      - snakemake>=9
