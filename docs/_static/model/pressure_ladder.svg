<text x="450" y="506" font-family="IBM Plex Sans, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#44586b" text-anchor="middle">Every arrow is one compressor, sized and dispatched by the optimiser. Each does a</text>
<text x="450" y="524" font-family="IBM Plex Sans, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#44586b" text-anchor="middle">different lift, so none is redundant — and no compressor is centralised.</text>
