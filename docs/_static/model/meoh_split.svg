<text x="460" y="493" font-family="IBM Plex Sans, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#7d8fa1" text-anchor="middle">With the store sized at zero the pair reproduces methanolisation exactly.</text>
