<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 640" width="100%" role="img" aria-label="The electrical grid interface: one shared connection capacity, many branches">
<title>The electrical grid interface: one shared connection capacity, many branches</title>
<rect width="940" height="640" fill="#ffffff"/>
<line x1="214" y1="60" x2="214" y2="600" stroke="#2f7d4f" stroke-width="2" stroke-dasharray="8 6"/>
