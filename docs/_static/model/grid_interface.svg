<text x="120" y="52" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="600" fill="#7d8fa1" text-anchor="middle">EXTERNAL</text>
<rect x="24" y="168" width="168" height="54" rx="6" fill="#f5f7fa" stroke="#bcc8d4" stroke-width="1.2"/>
<rect x="24" y="168" width="3.5" height="54" rx="2" fill="#c9820f"/>
<text x="36" y="188" font-family="IBM Plex Sans, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#14202c">DK1 spot market</text>
<text x="36" y="203" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#7d8fa1">hourly price · buy</text>
<line x1="192" y1="195" x2="252" y2="195" stroke="#c9820f" stroke-width="1.8"/>
<rect x="252" y="120" width="10" height="150" rx="4" fill="#c9820f" opacity="0.85"/>
<text transform="translate(246,195) rotate(-90)" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#44586b" text-anchor="middle">ElDK1 bus</text>
<defs><marker id="g1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#c9820f"/></marker></defs>
<line x1="262" y1="195" x2="398" y2="195" stroke="#c9820f" stroke-width="5" marker-end="url(#g1)"/>
<rect x="266" y="132" width="132" height="42" rx="6" fill="#ffffff" stroke="#c9820f" stroke-width="1.6"/>
<text x="332" y="148" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="600" fill="#14202c" text-anchor="middle">DK1_to_ElDK1_buy</text>
<text x="332" y="165" font-family="IBM Plex Sans, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#c9820f" text-anchor="middle">the only link with CAPEX</text>
<rect x="404" y="110" width="10" height="290" rx="4" fill="#c9820f" opacity="0.85"/>
<text transform="translate(398,255) rotate(-90)" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#44586b" text-anchor="middle">ElDK1 buy bus</text>
<line x1="414" y1="130" x2="656" y2="130" stroke="#bcc8d4" stroke-width="1.5" marker-end="url(#g2)"/>
<rect x="660" y="111" width="150" height="38" rx="6" fill="#ffffff" stroke="#bcc8d4" stroke-width="1.2"/>
