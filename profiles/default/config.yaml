# Workflow profile, loaded automatically by Snakemake (>= 8) on every run.
#
# It keeps Snakemake's defaults so the workflow behaves the same on every
# platform. Machine-specific settings belong in a personal profile outside the
# repository (export SNAKEMAKE_PROFILE=~/.config/snakemake/greenbubble).
# See "Troubleshooting" in docs/installation.rst for two common cases:
#
#   Apple Silicon without Rosetta ("Bad CPU type in executable"):
#     scheduler-ilp-solver: HiGHS
#
#   Repository inside OneDrive/Dropbox (metadata file names exceed the path limit):
#     persistence-backend: db
#     persistence-backend-db-url: sqlite:///.snakemake/metadata.db
#
# Snakemake rejects a profile without any key, so the default is stated here.
drop-metadata: false
