# =====================================================================
# Tutorial 3 — Rolling Horizon (dispatch-only) on the Tutorial 2b network
# =====================================================================
# Prerequisite: run Tutorial 2b (2_brownfield_heat) first to produce its *_OPT.nc.
#   cp tutorials/3_rolling_horizon/config.yaml   config/config.yaml
#   cp tutorials/3_rolling_horizon/n_config.yaml config/n_config.yaml
#   snakemake --cores 4
#
# Rolling horizon bypasses capacity expansion entirely: it loads the solved,
# fixed-capacity network at `network_path` and re-solves DISPATCH over sliding
# windows of `horizon` snapshots with `overlap` snapshots of overlap. It keeps
# the time resolution of that network (8 h here, so 63 snapshots = 3 weeks).
#
# Targets, flags and n_config match Tutorial 2b, so the RH file name describes
# the same plant. n_config.yaml is a copy of Tutorial 2b's.
# ---------------------------------------------------------------------

run_name: tut3_rh

amortization_period: 10

targets:
  driver: demand
  demand_H2:   580000
  demand_CH4:  262000
  demand_meoh:   0
  H2_demand_mode: flat
  CH4_demand_mode:  flat
  MeOH_demand_mode: flat

n_flags:
  meoh: false

clustering:
  temporal:
    resolution: 8h

rolling_horizon:
  enabled:      true
  horizon:       63            # window length (snapshots; 3 weeks at 8 h)
  overlap:       27            # overlap between consecutive windows (snapshots; 9 days)
  rh_year:      2024
  # the *_OPT.nc produced by Tutorial 2b:
  network_path: 'outputs/single_analysis/tut2_brownfield_heat/networks/B_H_RE_H2_METH_SN_ST_CO2_100_tD_H2_580_MeOH_0_CH4_262_2024_El_0.3_DET_8h_tut2_brownfield_heat_OPT.nc'
