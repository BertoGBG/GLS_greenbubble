# =====================================================================
# Tutorial 4 — brownfield + stochastic-compatibility settings
# =====================================================================
# Same brownfield assets as Tutorial 2, BUT stochastic mode requires a pure LP:
#   * committable: false everywhere (no binary unit-commitment) — already the
#     default for every technology here.
# Ramp limits keep their defaults: they work on scenario networks from PyPSA 1.3.
# ---------------------------------------------------------------------

# --- biomethanation only (catalytic methanation off) ---
methanation biogas:  {expansion: false}
methanation CO2:     {expansion: false}

# --- brownfield existing assets with residual CAPEX ---
biogas:
  initial capacity: 30
  expansion: false
  construction_year: 2020
  remaining_investment_fraction: 0.3
onwind:
  initial capacity: 52
  expansion: false
  construction_year: 2020
  remaining_investment_fraction: 0.3
solar:
  initial capacity: 30
  expansion: false
  construction_year: 2020
  remaining_investment_fraction: 0.3

# --- district heating off-take option ---
options:
  DH:
    enable: true
    price: 30
