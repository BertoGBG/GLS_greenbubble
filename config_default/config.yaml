# config/config.yaml
run_name: bg_engine_D

# CO2 tax for fossil emissions and reward for negative emissions
CO2_cost: 100 # €/t (CO2_cost)

# Others
CO2_cost_ref_year: 0

# Annual Demands or price targets
# if driver == 'demand': Demands must be present AND Prices are not used in the model
# if driver == 'price': Price must be present AND Demands are set as maximum annual production (e_nom_max)
targets:
  driver: 'demand' # 'price' | 'demand'.
  demand_H2 : 270000 # MWh_H2 /y  Demand OR max production
  demand_CH4 : 260000 # Mwh_CH4 /y Demand OR max production
  demand_meoh : 36000 # Mwh_meoh /y Demand OR max production
  price_H2 : 120 # €/MWh prices are required only for driver : 'price'
  price_bioCH4 : 20 #NG_based # €/MWh can be 'NG_based' (calculated from NG price + CO2 tax) or a value.
  price_meoh : 120 # €/MWh prices are required only for driver : 'price'

  CH4_demand_mode: bins_flat
  CH4_bins: 1
  CH4_flexibility: 0.0
  CH4_profile: null      # path to seasonal profile CSV (data/common/); null = built-in NG_DK
  H2_demand_mode: bins_flat
  H2_bins: 1
  H2_flexibility: 0.0
  H2_profile: null
  MeOH_demand_mode: bins_flat
  MeOH_bins: 1
  MeOH_flexibility: 0.0
  MeOH_profile: null
  demand_store_buffer: 0.0

# Sales of Electricity
max_RE_to_grid : 1 # # max share of RE consumed internally that can be sold to the grid (RE_sales <= RE_internal * max_RE_to_grid)

# Energy & Weather year
En_price_year: 2024

# Location
latitude: 56.566
longitude: 9.033

# Network configuration flags
n_flags:
  biogas: true
  central_heat: false
  renewables: true
  electrolysis: false
  meoh: false
  methanation: true
  symbiosis: true   # all internal connection between plants (El, H2, CO2, Heat MT, DH, LT)
  storage: false     # activate every storage (from n_config)
  print: true       # saves svg of prenetwork before optimization
  export: false     # exports prenetwork before optimization

# optimization flags
n_flags_opt:
  print: true       # saves svg of optimal network
  export: true      # exports optimal network to .nc
  plot: true

# Where to save single-run outputs
outputs_folder: outputs/single_analysis

# RFNBOs
rfnbos_dict:
  limit: 'price'         # emissions | price | unlimited | disconnected
  price_threshold: 20      # €/MWh
  emission_threshold: 0.0648   # tCO2e/MWh  (= 18 * 3.6 / 1000)

# Economics
year_EU: 2030
USD_to_EUR: 1.0
EUR_to_DKK: 7.46
discount_rate: 0.07

# Stochastic optimization
stochastic: false # true -> stochastic optimization across scenarios,  false -> deterministic optimization

# Rolling horizon dispatch optimisation
# Runs dispatch-only on a fixed-capacity network — bypasses capacity expansion entirely.
# When enabled, `snakemake` targets the RH output and does NOT run solve_network.
rolling_horizon:
  enabled: false
  horizon: 168        # window size in hours (e.g. 168 = 1 week)
  overlap: 24         # overlap in hours between consecutive windows
  network_path: null  # REQUIRED when enabled — path to a .nc network to load
  rh_year: null       # optional: year for RH inputs/weather; defaults to En_price_year
