# config/config.default.yaml
# BASE DEFAULTS — do not edit for individual runs.
# To customise, create config/config.yaml with only the keys that differ.
# docs: https://gls-greenbubble.readthedocs.io/en/latest/configuration.html

# docs: https://gls-greenbubble.readthedocs.io/en/latest/configuration.html#config-general
run_name: default
CO2_cost:          100   # €/t  (applied to fossil emissions from the model, and the diff with ref_year is applied to purchase of energy with emission from external grids)
CO2_cost_ref_year: 100   # €/t  (set if energy prices already embed a CO₂ tax)
max_RE_to_grid:    0.3
En_price_year:    2024
latitude:        56.566
longitude:        9.033
outputs_folder: outputs/single_analysis

# docs: https://gls-greenbubble.readthedocs.io/en/latest/configuration.html#config-targets
targets:
  driver: demand            # demand | price
  demand_H2:   200000       # MWh/y
  demand_CH4:  350000       # MWh/y
  demand_meoh:   9000       # MWh/y
  price_H2:      120        # €/MWh  (price mode only)
  price_bioCH4:  200        # €/MWh  (price mode only; or 'NG_based')
  price_meoh:    200        # €/MWh  (price mode only)
  CH4_demand_mode:    flat  # flat | profile | bins_flat | bins_profile
  CH4_bins:            1
  CH4_flexibility:  0.00
  CH4_profile:       null   # null = built-in NG_DK profile
  H2_demand_mode:    profile
  H2_bins:           12
  H2_flexibility:    0.2
  H2_profile:  data/common/NG_demand_DK_profile.csv
  MeOH_demand_mode:  bins_profile
  MeOH_bins:          2
  MeOH_flexibility:  0.5
  MeOH_profile: data/common/NG_demand_DK_profile.csv
  demand_store_buffer: 0.5

# docs: https://gls-greenbubble.readthedocs.io/en/latest/configuration.html#config-nflags
n_flags:
  biogas:       true
  central_heat: true
  renewables:   true
  electrolysis: true
  meoh:         true
  methanation:  true
  symbiosis:    true
  storage:      true
  print:        true
  export:       false

# docs: https://gls-greenbubble.readthedocs.io/en/latest/configuration.html#config-nflags-opt
n_flags_opt:
  print:  true
  export: true
  plot:   true

# docs: https://gls-greenbubble.readthedocs.io/en/latest/configuration.html#config-rfnbos
rfnbos_dict:
  limit:             unlimited    # emissions | price | unlimited | disconnected
  price_threshold:     20         # €/MWh
  emission_threshold:  0.0648     # tCO₂/MWh

# docs: https://gls-greenbubble.readthedocs.io/en/latest/configuration.html#config-economics
year_investment:       2030
amortization_period:   null   # null = each technology's technical lifetime
USD_to_EUR:            0.85
EUR_to_DKK:            7.46
discount_rate:         0.07

# docs: https://gls-greenbubble.readthedocs.io/en/latest/configuration.html#config-tariffs
# Values converted from DKK/MWh to €/MWh using EUR_to_DKK (7.46) — source
# figures were originally given in DKK; keep in €/MWh here so they add
# directly to Elspotprices (EUR/MWh).
tariffs_dict:
  el_transmission_tariff:  1.3298
  el_system_tariff:        0.9169
  el_afgift:               0
  el_net_tariff_low:       0.2681
  el_net_tariff_high:      0.8043
  el_net_tariff_peak:      1.6086
  el_tariff_sell:          0.1877
  NG_dso_tariff:           0.2413
  NG_tso_tariff:           0.00134

# docs: https://gls-greenbubble.readthedocs.io/en/latest/configuration.html#config-optimization
optimization:
  solver:            highs          # gurobi | highs
  solver_profile:    highs-fast    # see scripts/solver_profiles.py
  collect_all_duals:  true
  return_model:       true
  overrides:          null
  zero_threshold_MW:  0.01         # MW — components below this are treated as not built

# docs: https://gls-greenbubble.readthedocs.io/en/latest/configuration.html#config-stochastic
# NOTE: scenarios / CO2_cost_s / CO2_cost_ref_year_s are replaced wholesale
# (not deep-merged key-by-key) when overridden in config.yaml — see
# _REPLACE_WHOLESALE_KEYS in scripts/config.py. If you override any of them,
# you must give the COMPLETE dict (all years you want, probabilities summing
# to 1) — leftover years from this default will NOT be merged in, and none
# of these three will silently keep entries from here.
stochastic:
  stochastic: false
  scenarios:
    '2022': 0.10
    '2023': 0.40
    '2024': 0.50
  CO2_cost_s:
    '2022': 100
    '2023': 100
    '2024': 100
  CO2_cost_ref_year_s:
    '2022': 0
    '2023': 0
    '2024': 0
  EVPI: true

# docs: https://gls-greenbubble.readthedocs.io/en/latest/configuration.html#config-clustering
clustering:
  temporal:
    resolution: 4h   # false | "4h" | "8h" | "24h"

# docs: https://gls-greenbubble.readthedocs.io/en/latest/configuration.html#config-rolling-horizon
rolling_horizon:
  enabled:      false
  horizon:      168   # hours
  overlap:       72   # hours
  network_path: ''    # REQUIRED when enabled
  rh_year:      2024

# docs: https://gls-greenbubble.readthedocs.io/en/latest/configuration.html#config-mga
mga:
  enabled:      false
  network_path: ''
  # subset (~4-5) of auto-available technology names; [] = use all available dimensions
  dimensions:   [] # example: [onwind, solar, electrolysis, methanolisation, battery]
  slack:        0.05          # near-optimal budget: c.x <= c_opt + slack*|c_opt|
  # Tier 2 (near-optimal hull). n_directions: 0 runs Tier 1 (per-tech min/max ranges) only.
  n_directions: 40
  direction_sampling: halton  # halton | evenly_spaced | random
  max_parallel: 4
  seed:         42
  # Tier 3 (robustness): intersect per-year near-optimal spaces, take the Chebyshev centre.
  # `years` mirrors the stochastic.scenarios structure (weather/energy year + CO2 cost).
  robustness:
    enabled: false
    years:
      '2023': {CO2_cost: 100, CO2_cost_ref_year: 0}
      '2024': {CO2_cost: 100, CO2_cost_ref_year: 0}
      '2025': {CO2_cost: 100, CO2_cost_ref_year: 0}
    cost_bound: max           # 'max' = single bound c* = max_i c_opt(i) (Grochowicz eq. 9) | 'per_year'
