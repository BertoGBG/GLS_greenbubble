# SPDX-License-Identifier: MIT
# =====================================================================
# p_config -- PROCESS configuration: the physical state of every stream
# in the model, separate from the techno-economic data (technology-data
# / tech_inputs) and from the network component config (n_config).
#
# Division of labour, deliberately:
#   technology-data / tech_inputs  ->  MAGNITUDES  (MWh/MWh, t/MWh, EUR/kW)
#   p_config (this file)           ->  STATE       (fluid, T, P, LHV)
# A duty and its temperature therefore live in different files and are
# linked by reference, never duplicated -- duplicated numbers drift.
#
# Each stream carries up to three blocks:
#   state:  physical condition        -- fluid, T [C], P [bar(a)]
#   energy: energy content            -- LHV [MWh/t], moisture [-]
#   model:  PyPSA topology            -- carrier, buses
# A future heat-integration / pinch module reads `state` (and, later, a
# `process_streams` section) and never needs to know what a bus is.
#
# "${...}" references resolve against `globals` below; lhv.biogas is DERIVED
# from globals.mixtures.biogas at load time and is referenceable the same way.
#
# Overrides go in config/p_config.yaml (gitignored), deep-merged on top.
# =====================================================================

globals:
  T_max_comp: 160    # maximum discharge temperature for all compressors [C]
  T_ambient:  20    # [C]

  lhv:              # [MWh/t]
    ch4:     13.9
    h2:      33.33
    meoh:    5.54
    pellets: 4.027777777777778     # straw pellets at `moisture` 13%
    chips:   2.3     # moist biomass at `moisture`
    # biogas: DERIVED at load time from mixtures.biogas (mass-weighted CH4 fraction)

  # Minimum approach temperature for heat exchange [K].
  # DECLARED, NOT YET CONSUMED -- see "Declared but not consumed" in
  # docs/guide_process_streams.rst. Nothing reads this today; it changes no results.
  #
  # Pinch convention: a hot stream cannot heat a cold stream to its own temperature,
  # so duties are allocated on SHIFTED temperatures -- hot streams shifted DOWN by
  # dT_min/2, cold streams shifted UP by dT_min/2. Store the full dT_min here and
  # derive the half-shift; storing the half invites someone to halve it twice.
  # At 10 K the shift is 5 K each way, so a 160 C hot stream and a 150 C cold stream
  # both sit at 155 C shifted and are exactly pinched.
  dT_min: 10

  mixtures:         # mole fractions; CoolProp names
    biogas:
      Methane:       0.65
      CarbonDioxide: 0.35

# ---------------------------------------------------------------------
# shared -- states that belong to the NETWORK, not to any one process:
# distribution headers, heat tiers, storage conditions, external markets and
# the normal-condition reference states used for density calculations.
#
# A process port inherits from one of these with `from:` and overrides only
# what its unit operation changes (almost always just T and P, downstream of
# a compressor). Inheriting rather than restating is what makes two processes
# on the same bus agree by construction instead of by someone keeping two
# copies in step.
# ---------------------------------------------------------------------
shared:
  "Heat MT max":
    state: {fluid: "Water", T: 180, P: 10}
    model: {carrier: "Heat"}
  "Heat MT min":
    state: {fluid: "Water", T: 140, P: 3}
    model: {carrier: "Heat", buses: ["Heat MT", "Heat MT storage"]}
  "Heat DH min":
    state: {fluid: "Water", T: 90, P: 1}
    model: {carrier: "Heat", buses: ["Heat DH", "DH grid", "Heat DH storage"]}
  "Heat LT min":
    state: {fluid: "Water", T: 50, P: 1}
    model: {carrier: "Heat", buses: ["Heat LT"]}
  "Ambient":
    state: {fluid: "Air", T: "${T_ambient}", P: 1}
    model: {carrier: "Heat", buses: ["Heat amb"]}
  "H2 normal":
    state: {fluid: "H2", T: 0, P: 1}
    energy: {LHV: "${lhv.h2}"}
    model: {carrier: "H2", buses: []}
  "CO2 normal":
    state: {fluid: "CO2", T: 0, P: 1}
    energy: {LHV: 0}
    model: {carrier: "CO2", buses: []}
  "CH4 normal":
    state: {fluid: "CH4", T: 0, P: 1}
    energy: {LHV: "${lhv.ch4}"}
    model: {carrier: "gas", buses: []}
  "NG grid":
    state: {fluid: "CH4", T: "${T_ambient}", P: 40}
    energy: {LHV: "${lhv.ch4}"}
    model: {carrier: "gas", buses: ["NG"]}
  "H2 production":
    state: {fluid: "H2", T: 50, P: 30}
    energy: {LHV: "${lhv.h2}"}
    model: {carrier: "H2", buses: ["H2", "H2 distribution", "H2 delivery"]}
  "H2 HP storage":
    state: {fluid: "H2", T: "${T_ambient}", P: 150}
    energy: {LHV: "${lhv.h2}"}
    model: {carrier: "H2", buses: ["H2 HP storage"], bus_suffix: "H2 HP storage"}
  "CO2 biogas upgrading":
    state: {fluid: "CO2", T: 50, P: 1}
    model: {carrier: "CO2", buses: ["CO2 sep", "CO2 distribution", "CO2 to biomethanation"]}
  "biogas":
    state: {fluid: "biogas", T: 50, P: 1}
    energy: {LHV: "${lhv.biogas}"}
    model: {carrier: "gas", buses: ["biogas", "biogas to biomethanation"]}
  "CH4":
    state: {fluid: "CH4", T: 50, P: 1}
    energy: {LHV: "${lhv.ch4}"}
    model: {carrier: "gas", buses: ["CH4", "biomethane", "bio methane", "bio CH4"]}
  "meoh":
    state: {fluid: "Methanol", T: 50, P: 1}
    energy: {LHV: "${lhv.meoh}"}
    model: {carrier: "Methanol", buses: ["Methanol"]}
  "CO2 HP storage":
    state: {fluid: "CO2", T: "${T_ambient}", P: 60}
    model: {carrier: "CO2", buses: ["CO2 HP storage"], bus_suffix: "CO2 HP storage"}
  "CO2 from HP storage":
    state: {fluid: "CO2", T: "${T_ambient}", P: 30}
    model: {carrier: "CO2"}
  "CO2 from Liq storage":
    state: {fluid: "CO2", T: "${T_ambient}", P: 16}
    model: {carrier: "CO2"}
  "CO2 Liq storage":
    state: {fluid: "CO2", T: -26, P: 16}
    model: {carrier: "CO2", buses: ["CO2 Liq sequestration", "CO2 Liq storage"]}
  "pellets":
    state: {fluid: "pellets", T: "${T_ambient}"}
    energy: {LHV: "${lhv.pellets}", moisture: 0.13}
    model: {carrier: "pellets", buses: ["pellets"]}
  "chips":
    state: {fluid: "pellets", T: "${T_ambient}"}
    energy: {LHV: "${lhv.chips}", moisture: 0.5}
    model: {carrier: "moist biomass", buses: ["moist biomass"]}

# ---------------------------------------------------------------------
# processes -- ports of each unit operation, keyed by the port ROLE the
# code uses ('H2 in', 'CO2 in', 'product bus'...), so this mirrors the
# *_buses frames in prepare_network.py.
#
#   stream:  legacy flat name, still the index of symbiosis_n. Step 2 of the
#            migration removes it, once prepare_network.py looks ports up by
#            (process, role) instead of by flat name.
#   from:    inherit fluid / LHV / carrier from a shared state.
#            `from` NEVER inherits `buses` -- a bus belongs to exactly one
#            state, and inheriting bus lists is how you would silently create
#            the two-processes-one-bus conflict.
#   state:   overrides, typically the compressor discharge condition.
# ---------------------------------------------------------------------
processes:
  biomethanation:
    "H2 in":
      stream: "H2 to biomethanation"
      from: "shared:H2 production"
      state: {T: "${T_ambient}", P: 1}
      model: {buses: ["H2 to biomethanation"]}
  methanation:
    "CO2 in":
      stream: "CO2 to methanation"
      from: "shared:CO2 biogas upgrading"
      state: {T: "${T_max_comp}", P: 20}
      model: {buses: ["CO2 to methanation"]}
    "H2 in":
      stream: "H2 to methanation"
      from: "shared:H2 production"
      state: {T: "${T_max_comp}", P: 20}
      model: {buses: ["H2 to methanation"]}
    "biogas in":
      stream: "biogas to methanation"
      from: "shared:biogas"
      state: {T: "${T_max_comp}", P: 20}
      model: {buses: ["biogas to methanation"]}
  methanolisation:
    "CO2 in":
      stream: "CO2 to methanolisation"
      from: "shared:CO2 biogas upgrading"
      state: {T: "${T_max_comp}", P: 80}
      model: {buses: ["CO2 to methanolisation", "CO2 to meoh"]}
    "H2 in":
      stream: "H2 to methanolisation"
      from: "shared:H2 production"
      state: {T: "${T_max_comp}", P: 80}
      model: {buses: ["H2 to methanolisation"]}
