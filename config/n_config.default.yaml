# n_config.default.yaml
# BASE DEFAULTS — do not edit for scenario runs.
# To override, create config/n_config.yaml with only the keys you want to change.
#
# GREEN and BROWN field optimization
# for each technology set the initial capacity (with zero cost) and possibility to expand and the other constraints.

# common defaults for most technologies
base: &base
  initial capacity: 0 # default initial capacity null
  expansion: true # default capacity expansion
  cost factor: 1  # default to input source
  max capacity: .inf   # default to infinity

# -------------------  config (alphabetical) -------------------
# Units refer to bus0 in the network except for 'biogas'
# applies to all components of this each class (e.g. to all "H2 compressor" in the network)
battery: # includes inverter
  <<: *base
  max hours : 2
  expansion : true
  initial capacity: 0 # in MW for power discharge. Energy capacity as capacity * max hours

biogas: # (unit: MW CH4,  for simplicity)
  <<: *base

biogas storage:
  <<: *base
  max capacity: 200 # MWh

biogas upgrading: #
  <<: *base

biogas compressor: # applies to methanation
  <<: *base

biomass belt dryer:
  <<: *base
  cost factor: 1       # override
  expansion : false

biomass boiler:
  <<: *base
  expansion : true

biogas engine:
  <<: *base
  min load: 0.4 # % of max power capacity that must run (otherwise shut-off)
  expansion : true
  committable : false # -> only for expansion false or RH

biomethanation biogas: # (bus0 unit: MW H2)
  <<: *base
  ramp limit up: 1 # % of total power capacity per hour
  ramp limit down: 1 # % of total power capacity per hour

biomethanation CO2: # (bus0 unit: MW H2)
  <<: *base
  ramp limit up: 1 # % of total power capacity per hour
  ramp limit down: 1 # % of total power capacity per hour

methanation biogas: # (bus0 unit: MW H2)
  <<: *base
  ramp limit up: 0.08 # % of total power capacity per hour
  ramp limit down: 0.08 # % of total power capacity per hour
  min load: 0.4 # % of max power capacity that must run (otherwise shut-off)
  committable : false # -> only for initial capacity or RH

methanation CO2: # (bus0 unit: MW H2)
  <<: *base
  ramp limit up: 0.08 # % of total power capacity per hour
  ramp limit down: 0.08 # % of total power capacity per hour
  min load: 0.4 # % of max power capacity that must run (otherwise shut-off)
  committable : false # -> only for initial capacity or RH

CH4 compressor: # applies to both meoh and methanation
  <<: *base
  #expansion: true # valid for both centralized and plant-specific
  #capacity: 0 # valid only for centralized

CO2 compressor: # applies to both meoh and methanation
  <<: *base
  #expansion: true # valid for both centralized and plant-specific
  #capacity: 0 # valid only for centralized

CO2 HP storage:
  <<: *base
  expansion: true # valid for both centralized and plant-specific

CO2 Liq storage: # NOTE: for expansion e_nom in store and p_nom in liquefaction are optimized separately. Initial capacity has a constant ratio (c-rate = 1)
  <<: *base
  expansion: true

CO2 pipe:
  <<: *base

dewatering:
  <<: *base
  expansion : false

El boiler:
  <<: *base
  expansion : true

electrolysis: # (bus0 unit: MW el )
  <<: *base
  cost factor: 1      # according to IEA (last pypsa-eur inputs)
  ramp limit up: 0.9 # % of total power capacity per hour
  ramp limit down: 0.9 # % of total power capacity per hour
  min load: 0.15 # % of max power capacity that must run (otherwise shut-off)
  committable : false # -> only for initial capacity or RH

DH heat exchanger:
  <<: *base

#eSMR meoh: # TODO add to the model
#  <<: *base
#  ramp limit up: 0.08 # % of total power capacity per hour
#  ramp limit down: 0.08 # % of total power capacity per hour
#  min load: 0.15 # % of max power capacity that must run (otherwise shut-off)
#  expansion : false # KEEP false
#  initial capacity : 0 # KEEP 0

grid connection:
  <<: *base
  expansion : true

H2 compressor:
  <<: *base
  #expansion: true # valid for both centralized and plant-specific
  #capacity: 0 # valid only for centralized

H2 pipe:
  <<: *base
  cost factor: 1

H2 HP storage:
  <<: *base
  expansion: true # valid for both centralized and plant-specific

heat pump:
  <<: *base
  expansion : false

methanolisation: # (bus0 unit: t/h CO2)
  <<: *base
  ramp limit up: 0.08 # % of total power capacity per hour
  ramp limit down: 0.08 # % of total power capacity per hour
  min load: 0.15 # % of max power capacity that must run (otherwise shut-off)
  committable : false # -> only for initial capacity or RH

NG boiler:
  <<: *base
  expansion : true

onwind:
  <<: *base

pelletization:
  <<: *base

pyrolysis:
  <<: *base
  expansion : false

solar:
  <<: *base

TES concrete: # capacity in MW of output power. Energy capacity as capacity * max hours
  <<: *base
  max hours : 10
  efficiency store : 0.95
  efficiency dispatch : 0.95
  standing loss: 0.02 # % of total energy  per hour
  expansion: false

TES DH: # capacity in MW of output power. Energy capacity as capacity * max hours
  <<: *base
  max hours : 50
  standing loss: 0.002 # % of total energy  per hour
  expansion: false

# -------------------  options config (alphabetical) -------------------
# (merged from n_options.yaml)
options:
  biochar credits:
    enable: false

  CO2 Liq credits:
    enable: false
    efficiency: 0.95 # assumption including boil off

  Dig biomass:
    max capacity: .inf # t/y of manure and biomass
    price : 0 # 19.8676 # EUR/MWh biogas from JRC ENSPRESO

  DH:
    enable: false
    price : 30 # €/MWh
    load multiplier : 1 # keeps the load profile but multiplies the demand to represent new locations

  moist biomass market:
    enable: false
    max capacity: 20000 # (MWh/y) max limit  if biochar credits['expansion'] : true
    price : 43 # €/MWh

  pellets market:
    enable: true
    max capacity: .inf # (MWh/y) max limit if biochar credits['expansion'] : true
    price : 45 # €/MWh

  symbiosis El transformer:
    expansion: true
