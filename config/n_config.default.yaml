# n_config.default.yaml
# BASE DEFAULTS — do not edit for scenario runs.
# To override, create config/n_config.yaml with only the keys you want to change.
#
# ── Greenfield / Brownfield configuration ───────────────────────────────────
# Three parameters jointly define each technology's investment mode:
#
#   initial capacity   expansion   remaining_investment_fraction   →  Mode
#   ────────────────   ─────────   ─────────────────────────────   ──────────────────────────────
#        0             false              any                      Technology absent (rif ignored)
#        0             true               0                        Greenfield — pure new capacity
#       >0             false              0                        Brownfield — fixed, sunk cost
#       >0             false             >0                        Brownfield — fixed, residual CAPEX charged
#       >0             true               0                        Mixed — existing (free) + expandable
#       >0             true              >0                        Mixed — existing (residual CAPEX) + expandable
#
# cost factor                   — multiplier on capital_cost for NEW capacity (sensitivity analysis).
# construction_year             — year the existing asset was built; null = year_investment - 10
#                                 (capped at 2020, the earliest available technology-data year).
#                                 Used to look up investment cost at the actual build year.
# remaining_investment_fraction — fraction of investment(construction_year) still to recover.
#                                 0 = sunk cost (no annual charge); 1 = full remaining investment.
#                                 Annual charge = rif × investment(construction_year)
#                                               × annuity(discount_rate, amortization_period).
# ────────────────────────────────────────────────────────────────────────────

# common defaults for most technologies
base: &base
  initial capacity: 0              # MW (or unit of bus0) of already-installed capacity
  expansion: true                  # allow new capacity to be built on top of initial
  cost factor: 1                   # capital cost multiplier for new capacity (1 = tech-data value)
  construction_year: null          # null → year_investment - 10 (capped at 2020)
  remaining_investment_fraction: 0 # fraction of investment(construction_year) still to recover
  max capacity: .inf               # upper bound on total capacity

# -------------------  config (alphabetical) -------------------
# Units refer to bus0 in the network except for 'biogas'
# applies to all components of this each class (e.g. to all "H2 compressor" in the network)

battery: # includes inverter
  <<: *base
  max hours : 2
  expansion : true
  initial capacity: 0 # in MW for power discharge. Energy capacity as capacity * max hours

biogas: # (unit: MW CH4,  for simplicity)
  <<: *base

biogas storage:
  <<: *base
  max capacity: 200 # MWh

biogas upgrading: #
  <<: *base

biogas compressor: # applies to methanation
  <<: *base

biomass belt dryer:
  <<: *base
  cost factor: 1       # override
  expansion : false

biomass boiler:
  <<: *base
  expansion : true

biogas engine:
  <<: *base
  min load: 0.4 # % of max power capacity that must run (otherwise shut-off)
  expansion : true
  committable : false # -> only for expansion false or RH

biomethanation: # (bus0 unit: MW H2)
  <<: *base
  ramp limit up: null # % of total power capacity per hour
  ramp limit down: null # % of total power capacity per hour

biomethanation CO2: # (bus0 unit: MW H2)
  <<: *base
  ramp limit up: null # % of total power capacity per hour
  ramp limit down: null # % of total power capacity per hour

methanation biogas: # (bus0 unit: MW H2)
  <<: *base
  ramp limit up: 0.08 # % of total power capacity per hour
  ramp limit down: 0.08 # % of total power capacity per hour
  min load: 0.3 # % of max power capacity that must run (otherwise shut-off)
  committable : false # -> only for initial capacity or RH

methanation CO2: # (bus0 unit: MW H2)
  <<: *base
  ramp limit up: 0.08 # % of total power capacity per hour
  ramp limit down: 0.08 # % of total power capacity per hour
  min load: 0.3 # % of max power capacity that must run (otherwise shut-off)
  committable : false # -> only for initial capacity or RH

CH4 compressor: # applies to both meoh and methanation
  <<: *base
  #expansion: true # valid for both centralized and plant-specific
  #capacity: 0 # valid only for centralized

CO2 compressor: # applies to both meoh and methanation
  <<: *base
  #expansion: true # valid for both centralized and plant-specific
  #capacity: 0 # valid only for centralized

CO2 HP storage:
  <<: *base
  expansion: true # valid for both centralized and plant-specific

CO2 Liq storage: # NOTE: for expansion e_nom in store and p_nom in liquefaction are optimized separately. Initial capacity has a constant ratio (c-rate = 1)
  <<: *base
  expansion: true

CO2 pipe:
  <<: *base

dewatering:
  <<: *base
  expansion : false

El boiler:
  <<: *base
  expansion : true

electrolysis: # (bus0 unit: MW el )
  <<: *base
  cost factor: 1      # according to IEA (last pypsa-eur inputs)
  ramp limit up: 0.9 # % of total power capacity per hour
  ramp limit down: 0.9 # % of total power capacity per hour
  min load: 0.15 # % of max power capacity that must run (otherwise shut-off)
  committable : false # -> only for initial capacity or RH

DH heat exchanger:
  <<: *base

grid connection:
  <<: *base
  expansion : true

H2 compressor:
  <<: *base
  #expansion: true # valid for both centralized and plant-specific
  #capacity: 0 # valid only for centralized

H2 pipe:
  <<: *base
  cost factor: 1

H2 HP storage:
  <<: *base
  expansion: true # valid for both centralized and plant-specific

heat pump:
  <<: *base
  expansion : false

methanolisation: # (bus0 unit: t/h CO2)
  <<: *base
  ramp limit up: 0.08 # % of total power capacity per hour
  ramp limit down: 0.08 # % of total power capacity per hour
  min load: 0.15 # % of max power capacity that must run (otherwise shut-off)
  committable : false # -> only for initial capacity or RH

NG boiler:
  <<: *base
  expansion : true

onwind:
  <<: *base

pelletization:
  <<: *base

pyrolysis:
  <<: *base
  expansion : false

solar:
  <<: *base

TES concrete: # Store + bidirectional HX Link (Heat MT).
              # initial capacity: MWh; link p_nom = energy / min_max_hours
  <<: *base
  min_max_hours: 8       # p_nom_HX × min_max_hours ≤ e_nom_store
  standing loss: 0.02
  # efficiency charge: null  # override bidirectional HX efficiency (default: 1.0)
  expansion: false

TES concrete El: # Store + electric charger (El3→heat) + heat discharger (heat→Heat MT).
                 # initial capacity: MWh; charger p_nom = energy/min_max_hours_charge,
                 #                        discharger p_nom = energy/min_max_hours_discharge
  <<: *base
  min_max_hours_charge: 4      # min MWh per MW of electric charging power
  min_max_hours_discharge: 15  # min MWh per MW of heat discharge power
  standing loss: 0.02
  # efficiency charge:    null  # override Concrete-charger eff (default: tech-data ≈0.99)
  # efficiency discharge: null  # override Concrete-discharger eff (default: tech-data ≈0.43)
  expansion: false

TES DH: # Store + bidirectional HX Link (Heat DH).
        # initial capacity: MWh; link p_nom = energy / min_max_hours
  <<: *base
  min_max_hours: 10      # p_nom_HX × min_max_hours ≤ e_nom_store
  standing loss: 0.002
  # efficiency charge: null  # override central water tank charger eff (default: 1.0)
  expansion: true

# -------------------  options config (alphabetical) -------------------
# (merged from n_options.yaml)
options:
  biochar credits:
    enable: false

  CO2 Liq credits:
    enable: false
    efficiency: 0.95 # assumption including boil off

  Dig biomass:
    max capacity: .inf # t/y of manure and biomass
    price : 0 # 19.8676 # EUR/MWh biogas from JRC ENSPRESO

  DH:
    enable: false
    price : 70          # €/MWh — flat price used when price profile is null
    price profile: null # path to CSV with hourly DH sale price (€/MWh);
                        # null → flat price. CSV needs a datetime index + one value
                        # column; resampled to network snapshot resolution automatically.
    peak capacity : 60  # MW — reference peak demand used to scale the DH profile in preprocessing
    load multiplier : 1 # additional multiplier applied at build time (no preprocessing re-run needed)

  moist biomass market:
    enable: false
    max capacity: 20000 # (MWh/y) max limit  if biochar credits['expansion'] : true
    price : 40 # €/MWh

  pellets market:
    enable: true
    max capacity: .inf # (MWh/y) max limit if biochar credits['expansion'] : true
    price : 60 # €/MWh

  symbiosis El transformer:
    expansion: true
